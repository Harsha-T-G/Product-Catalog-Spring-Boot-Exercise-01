spring:
  application:
    name: Product Catalog API
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

catalog:
  low-stock-threshold: 5
  maximum-products: ${CATALOG_MAXIMUM_PRODUCTS:500}
  default-category: General
  default-page-size: 20
  max-page-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: never
  info:
    env:
      enabled: true
