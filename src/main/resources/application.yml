spring:
  application:
    name: Product Catalog API

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0

catalog:
  low-stock-threshold: 5
  maximum-products: ${CATALOG_MAXIMUM_PRODUCTS:500}
  default-category: General

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true
