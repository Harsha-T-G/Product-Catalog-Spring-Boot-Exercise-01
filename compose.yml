services:
  postgres:
    image: postgres:16-alpine
    container_name: product-catalog-postgres
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: product_catalog_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - product_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U product_catalog_app -d product_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  product_catalog_data:
